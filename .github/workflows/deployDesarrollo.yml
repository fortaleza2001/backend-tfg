name: Deploy to AWS desarrollo

on:
  push:
    branches:
      - desarrollo  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          printf "%s" "${{ secrets.AWS_SSH_KEY }}" > aws_key.pem
          chmod 600 aws_key.pem

          

      - name: Connect to EC2 and Pull Changes
        run: |
          ssh -o StrictHostKeyChecking=no -i aws_key.pem juan@ec2-3-228-202-70.compute-1.amazonaws.com << 'EOF'
            cd /home/juan/desarrollo/backend-tfg
            git checkout desarrollo
            git reset --hard HEAD
            git pull origin desarrollo 
            echo "Seteando variable de entorno de desarrollo ...."
            echo "${{ secrets.LARAVEL_ENV_DESARROLLO }}" > /home/juan/desarrollo/backend-tfg/.env
            grep -q 'APP_URL=' /home/juan/desarrollo/backend-tfg/.env || echo 'APP_URL=https://api.mythical-airline.tech' >> /home/juan/desarrollo/backend-tfg/.env
            grep -q 'COOKY_DOMAIN_DOMAIN=' /home/juan/desarrollo/backend-tfg/.env || echo 'COOKY_DOMAIN=.mythical-airline.tech' >> /home/juan/desarrollo/backend-tfg/.env
            grep -q 'GITHUB_CLIENT_ID=' /home/juan/desarrollo/backend-tfg/.env || echo 'GITHUB_CLIENT_ID = Ov23licRjfB7gffZOXvg' >> /home/juan/desarrollo/backend-tfg/.env
            grep -q 'GITHUB_CLIENT_SECRET=' /home/juan/desarrollo/backend-tfg/.env || echo 'GITHUB_CLIENT_SECRET = 778eb23f58542240c7f75d23beab307ed040d5be' >> /home/juan/desarrollo/backend-tfg/.env
            grep -q 'GITHUB_REDIRECT_URI=' /home/juan/desarrollo/backend-tfg/.env || echo 'GITHUB_REDIRECT_URI = https://api.mythical-airline.tech/auth/github/callback' >> /home/juan/desarrollo/backend-tfg/.env

             
            composer update
            composer install
            php artisan migrate:refresh --seed
            php artisan l5-swagger:generate
            echo " Deteniendo cualquier proceso en el puerto 8000..."
            fuser -k 8000/tcp || true
            echo " Iniciando Laravel en el puerto 8000..."
            nohup php artisan serve --host=0.0.0.0 --port=8000 > /dev/null 2>&1 &
            echo "✅ Despliegue completado."
            exit
          EOF
